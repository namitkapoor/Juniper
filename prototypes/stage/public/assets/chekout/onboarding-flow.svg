<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#141414"/><text x="48" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="2">CHEKOUT AI · ONBOARDING &amp; AGENT BUILDER</text><text x="48" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#ececea" text-anchor="start" letter-spacing="0">A merchant goes from an app-store install to a live agent in three steps; store OAuth and product sync run inside step 1.</text><rect x="48.0" y="170" width="280" height="150" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="64.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">App-store install</text><text x="64.0" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Shopify and Shopline listings;</text><text x="64.0" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">embedded Shopify app</text><rect x="255.5" y="161" width="64.5" height="18" fill="#141414"/><text x="314.0" y="174" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">[notes]</text><rect x="456.0" y="170" width="280" height="150" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="472.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Step 1 · AI Persona</text><text x="472.0" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Agent name, store URL, tone,</text><text x="472.0" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">platform; Connect starts store</text><text x="472.0" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">sync</text><rect x="671.0" y="161" width="57.0" height="18" fill="#141414"/><text x="722.0" y="174" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">[code]</text><rect x="864.0" y="170" width="280" height="150" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="880.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Store OAuth</text><text x="880.0" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">generate-url, consent,</text><text x="880.0" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">/sync/[platform]/callback,</text><text x="880.0" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">/api/oauth/complete with hmac +</text><text x="880.0" y="289" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">state; signed-state CSRF check</text><rect x="1019.0" y="161" width="117.0" height="18" fill="#141414"/><text x="1130.0" y="174" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">[code + notes]</text><rect x="1272.0" y="170" width="280" height="150" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="1288.0" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Product sync</text><text x="1288.0" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Platform webhooks push product</text><text x="1288.0" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">changes; per-product</text><text x="1288.0" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">connections fixed, about 30 s</text><text x="1288.0" y="289" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">down to ms</text><rect x="1479.5" y="161" width="64.5" height="18" fill="#141414"/><text x="1538.0" y="174" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">[notes]</text><rect x="456.0" y="400" width="280" height="150" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="472.0" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Step 2 · Knowledge Base</text><text x="472.0" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Upload pdf, txt, doc, csv, json</text><text x="472.0" y="477" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">up to 10 MB via a signed upload</text><text x="472.0" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">URL</text><rect x="671.0" y="391" width="57.0" height="18" fill="#141414"/><text x="722.0" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">[code]</text><rect x="864.0" y="400" width="280" height="150" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="880.0" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Agent provisioning</text><text x="880.0" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">POST /agents/create; a prompt</text><text x="880.0" y="477" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">generated from the storefront,</text><text x="880.0" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">which the merchant can edit</text><rect x="1019.0" y="391" width="117.0" height="18" fill="#141414"/><text x="1130.0" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">[code + notes]</text><rect x="1272.0" y="400" width="280" height="150" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="1288.0" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Step 3 · Channel</text><text x="1288.0" y="456" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Widget styling + embed snippet;</text><text x="1288.0" y="477" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">progress via SSE, with polling</text><text x="1288.0" y="498" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">as the fallback</text><rect x="1427.0" y="391" width="117.0" height="18" fill="#141414"/><text x="1538.0" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">[code + notes]</text><polyline points="328.0,245.0 454.0,245.0" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="392.0" y="235.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">opens app</text><polyline points="736.0,245.0 862.0,245.0" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="800.0" y="235.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">Connect</text><polyline points="1144.0,245.0 1270.0,245.0" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1208.0" y="219.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">store</text><text x="1208.0" y="235.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">authorized</text><polyline points="736.0,475.0 862.0,475.0" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="800.0" y="465.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">createAgent</text><polyline points="1144.0,475.0 1270.0,475.0" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1208.0" y="449.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">progress</text><text x="1208.0" y="465.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">events</text><polyline points="596.0,320 596.0,398" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="608.0" y="365.0" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">Save and Next</text><rect x="48" y="604" width="22" height="12" fill="none" stroke="rgba(255,255,255,0.6)"/><text x="78" y="615" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">built by me</text><rect x="210" y="604" width="22" height="12" fill="none" stroke="rgba(255,255,255,0.22)" stroke-dasharray="4 4"/><text x="240" y="615" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">teammate or outside service</text><text x="1552" y="615" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">drawn from FigJam: 2 · Onboarding &amp; agent builder</text></svg>
