merce platforms</text><text x="1298.0" y="426" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#3a3a38" text-anchor="start" letter-spacing="0">Shopify (OAuth in code);</text><text x="1298.0" y="447" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#3a3a38" text-anchor="start" letter-spacing="0">Shopline, WooCommerce</text><rect x="1427.0" y="361" width="117.0" height="18" fill="#e2e2e0"/><text x="1538.0" y="374" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#545450" text-anchor="end" letter-spacing="0">[code + notes]</text><rect x="48.0" y="570" width="270" height="130" fill="none" stroke="rgba(0,0,0,0.34)" stroke-width="1" stroke-dasharray="4 4"/><text x="64.0" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Shoppers</text><text x="64.0" y="626" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#3a3a38" text-anchor="start" letter-spacing="0">Storefront visitors who chat</text><text x="64.0" y="647" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#3a3a38" text-anchor="start" letter-spacing="0">with a merchant&#x27;s agent</text><rect x="245.5" y="561" width="64.5" height="18" fill="#e2e2e0"/><text x="304.0" y="574" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#545450" text-anchor="end" letter-spacing="0">[notes]</text><rect x="870.6666666666667" y="570" width="270" height="130" fill="none" stroke="rgba(0,0,0,0.34)" stroke-width="1" stroke-dasharray="4 4"/><text x="886.6666666666667" y="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a" text-anchor="start" letter-spacing="0">Postgres + BigQuery</text><t