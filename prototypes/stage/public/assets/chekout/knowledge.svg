<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#141414"/><text x="48" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="2">CHEKOUT AI · HOW A CATALOG BECOMES THE AGENT&#x27;S KNOWLEDGE</text><text x="48" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#ececea" text-anchor="start" letter-spacing="0">Product sync turns each store&#x27;s catalog into vectors in Postgres; the agent retrieves from them when a shopper asks.</text><rect x="48" y="190" width="280" height="130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="64" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Merchant&#x27;s store</text><text x="64" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Shopify or Shopline</text><text x="64" y="267" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">catalog and orders</text><rect x="420" y="170" width="340" height="170" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="436" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">OAuth install</text><text x="436" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Signed-state CSRF check,</text><text x="436" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">merchant ID normalized,</text><text x="436" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">scopes read per merchant</text><polyline points="328,255 418,255" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="373" y="245" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">install</text><rect x="850" y="170" width="330" height="170" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="866" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Product sync (FastAPI)</text><text x="866" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Webhooks plus full sync,</text><text x="866" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">a page written as one</text><text x="866" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">batched upsert</text><polyline points="760,255 848,255" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="804" y="245" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">token</text><rect x="1260" y="170" width="292" height="170" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="1276" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Vertex AI embeddings</text><text x="1276" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">text-embedding-004,</text><text x="1276" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">retried on transient</text><text x="1276" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">failures</text><polyline points="1180,220 1258,220" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1219" y="210" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">text</text><polyline points="1258,290 1180,290" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1219" y="310" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">vectors</text><rect x="850" y="430" width="330" height="130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="866" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Postgres + pgvector</text><text x="866" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Products with their</text><text x="866" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">embeddings, per merchant</text><polyline points="1015,340 1015,428" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1025" y="390" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">upsert</text><rect x="420" y="430" width="340" height="130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="436" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Agent per merchant</text><text x="436" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Langflow flow; retrieves</text><text x="436" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">products at answer time</text><polyline points="848,495 762,495" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="805" y="485" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">retrieve</text><rect x="48" y="430" width="280" height="130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="64" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Shopper</text><text x="64" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Asks in the widget</text><text x="64" y="507" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">on the store</text><polyline points="328,495 418,495" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="373" y="485" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">ask</text><rect x="420" y="650" width="340" height="130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="436" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">BigQuery</text><text x="436" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Conversation logs for</text><text x="436" y="727" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">merchant analytics</text><polyline points="590,560 590,648" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="600" y="610" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">logs</text><rect x="850" y="650" width="330" height="130" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="866" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Analytics API (FastAPI)</text><text x="866" y="706" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Engaged sessions, keywords,</text><text x="866" y="727" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">intent for the dashboard</text><polyline points="760,715 848,715" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="804" y="705" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">query</text><rect x="48" y="859" width="22" height="12" fill="none" stroke="rgba(255,255,255,0.6)"/><text x="78" y="870" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">built by me</text><rect x="210" y="859" width="22" height="12" fill="none" stroke="rgba(255,255,255,0.22)" stroke-dasharray="4 4"/><text x="240" y="870" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">teammate or outside service</text><text x="1552" y="870" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">drawn from shopify-sync, shopline-sync, chekout-backend and the ChekOut architecture board</text></svg>
