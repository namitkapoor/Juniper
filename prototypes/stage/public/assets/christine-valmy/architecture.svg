<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#141414"/><text x="48" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#7d7d79" text-anchor="start" letter-spacing="2">CHRISTINE VALMY · ENROLLMENT AGENT</text><text x="48" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#ececea" text-anchor="start" letter-spacing="0">The widget talks to n8n on Google Cloud; chats become leads, and data lands in BigQuery.</text><rect x="48" y="330" width="260" height="130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="64" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Prospective students</text><text x="64" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">English or Spanish,</text><text x="64" y="407" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">on phone or desktop</text><rect x="390" y="300" width="320" height="190" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="406" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Widget (WordPress plugin)</text><text x="406" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">React chat and inquiry form,</text><text x="406" y="377" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">both languages, WCAG AA,</text><text x="406" y="398" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">reCAPTCHA v3 on each message</text><polyline points="308,395 388,395" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="348" y="385" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7d7d79" text-anchor="middle" letter-spacing="0">ask</text><rect x="800" y="170" width="330" height="150" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="816" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">n8n on Google Cloud</text><text x="816" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Each message in; the reply</text><text x="816" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">and conversation stage out</text><polyline points="710,340 755,340 755,245 798,245" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><rect x="1220" y="170" width="332" height="150" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="1236" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Agent</text><text x="1236" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">RAG on the school&#x27;s documents;</text><text x="1236" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">routed through MCP: Claude for</text><text x="1236" y="268" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">English, Gemini for Spanish</text><polyline points="1130,245 1218,245" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1174" y="235" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7d7d79" text-anchor="middle" letter-spacing="0">query</text><rect x="1220" y="30" width="332" height="110" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="1236" y="60" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Schedule pipeline</text><text x="1236" y="86" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Keeps class schedules</text><text x="1236" y="107" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">fresh in the agent</text><polyline points="1386,140 1386,168" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><rect x="800" y="420" width="330" height="150" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="816" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">n8n: finished chats</text><text x="816" y="476" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Full transcript when a stage</text><text x="816" y="497" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">completes or the chat closes</text><polyline points="710,450 755,450 755,495 798,495" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><rect x="1220" y="420" width="332" height="150" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="1236" y="450" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Lead for officers</text><text x="1236" y="476" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Priority bucket,</text><text x="1236" y="497" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">bad leads flagged</text><polyline points="1130,495 1218,495" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1174" y="485" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7d7d79" text-anchor="middle" letter-spacing="0">lead</text><rect x="800" y="660" width="330" height="130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="816" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Creatio CRM</text><text x="816" y="716" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">The school&#x27;s CRM: the inquiry</text><text x="816" y="737" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">form creates a lead</text><rect x="1220" y="660" width="332" height="130" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="1236" y="690" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">BigQuery</text><text x="1236" y="716" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Conversation and lead data</text><polyline points="1386,570 1386,658" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><polyline points="550,490 550,725 798,725" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="560" y="712" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7d7d79" text-anchor="start" letter-spacing="0">inquiry form</text><rect x="48" y="859" width="22" height="12" fill="none" stroke="rgba(255,255,255,0.6)"/><text x="78" y="870" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7d7d79" text-anchor="start" letter-spacing="0">built by me</text><rect x="210" y="859" width="22" height="12" fill="none" stroke="rgba(255,255,255,0.22)" stroke-dasharray="4 4"/><text x="240" y="870" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7d7d79" text-anchor="start" letter-spacing="0">teammate or outside service</text><text x="1552" y="870" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7d7d79" text-anchor="end" letter-spacing="0">drawn from the plugin