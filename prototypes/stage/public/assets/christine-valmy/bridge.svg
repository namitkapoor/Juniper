<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#141414"/><text x="48" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="2">CHRISTINE VALMY · THE BRIDGE</text><text x="48" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#ececea" text-anchor="start" letter-spacing="0">Three calls leave the widget: one per message, one when the chat ends, one when the form is sent.</text><rect x="48" y="170" width="420" height="140" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="64" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">1 · Each message</text><text x="64" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">query, user and thread ids,</text><text x="64" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">history, reCAPTCHA v3 token</text><rect x="620" y="170" width="420" height="140" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="636" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">n8n on Google Cloud</text><text x="636" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">reply, conversation stage,</text><text x="636" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">enrollment state, complete?</text><polyline points="468,240 618,240" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><rect x="48" y="360" width="420" height="140" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="64" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">2 · When the chat ends</text><text x="64" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">full transcript, completion</text><text x="64" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">reason, message count, page</text><rect x="620" y="360" width="420" height="140" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="636" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">n8n: finished chat</text><text x="636" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">sent once per reason; sendBeacon</text><text x="636" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">if the tab is closing</text><polyline points="468,430 618,430" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><rect x="48" y="550" width="420" height="140" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/><text x="64" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">3 · The inquiry form</text><text x="64" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">name, contact details,</text><text x="64" y="627" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">location and language</text><rect x="620" y="550" width="420" height="140" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="636" y="580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Creatio CRM</text><text x="636" y="606" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">creates the lead in the</text><text x="636" y="627" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">school&#x27;s CRM</text><polyline points="468,620 618,620" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><rect x="1180" y="360" width="372" height="140" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="1196" y="390" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">Lead for officers</text><text x="1196" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">n8n answers whether a lead</text><text x="1196" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">was generated; the widget</text><text x="1196" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">stops sending after that</text><polyline points="1040,430 1178,430" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1109" y="420" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="middle" letter-spacing="0">lead</text><rect x="1180" y="170" width="372" height="140" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 4"/><text x="1196" y="200" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ececea" text-anchor="start" letter-spacing="0">BigQuery</text><text x="1196" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">Conversation and lead data</text><text x="1196" y="247" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a9a9a4" text-anchor="start" letter-spacing="0">from the workflow</text><polyline points="1040,240 1178,240" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" marker-end="url(#a)"/><text x="1180" y="560" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">Stages that end a chat: enrollment collection,</text><text x="1180" y="580" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">completion, post enrollment.</text><rect x="48" y="724" width="22" height="12" fill="none" stroke="rgba(255,255,255,0.6)"/><text x="78" y="735" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">built by me</text><rect x="210" y="724" width="22" height="12" fill="none" stroke="rgba(255,255,255,0.22)" stroke-dasharray="4 4"/><text x="240" y="735" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="start" letter-spacing="0">teammate or outside service</text><text x="1552" y="735" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#85857f" text-anchor="end" letter-spacing="0">drawn from the plugin code and Namit&#x27;s confirmation, Nov 2026</text></svg>
