<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#1f2a33"/>
<circle cx="600" cy="400" r="80" fill="none" stroke="#9fb4c4" stroke-width="3"><animate attributeName="r" values="60;240;60" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle>
<text x="600" y="720" fill="#fff" fill-opacity=".5" font-family="monospace" font-size="40" text-anchor="middle">FIXTURE animation 3:2</text>
</svg>